# Alembic config for the tutor's memory schema. Migrations are plain SQL (no ORM
# models); the database URL is read from QCB_DATABASE_URL by migrations/env.py,
# not hard-coded here. Apply with `make migrate` (or `alembic upgrade head`).
[alembic]
script_location = backend/migrations
prepend_sys_path = .
# Timestamped, slug-friendly revision filenames.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
